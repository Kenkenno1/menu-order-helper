ight:46px;text-align:center;white-space:nowrap;font-variant-numeric:tabular-nums}.st-note{font-size:19px;color:var(--warn);margin-top:4px;line-height:1.45;word-break:break-word}.st-zh{font-size:14px;color:var(--ink3);margin-top:4px;word-break:break-word}.st-tag{display:inline-block;font-size:12px;font-weight:600;color:var(--accent);border:1px solid var(--accent-soft);border-radius:8px;padding:0 6px;margin-left:6px;vertical-align:middle;line-height:1.6}.st-pending{color:var(--ink3);font-size:15px;font-weight:400}.st-total{font-size:21px;font-weight:700;text-align:right;margin-top:16px}.st-end{font-size:23px;font-weight:800;text-align:center;margin-top:20px}.st-empty{color:var(--ink3);text-align:center;margin-top:60px;font-size:17px}.zh-toggle{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:16px;min-height:48px}.zh-toggle input{width:24px;height:24px;accent-color:var(--accent)}#turnstile-container{position:fixed;left:50%;top:50%;z-index:70;width:min(340px,calc(100vw - 28px));padding:14px;border:1px solid var(--line);border-radius:16px;background:var(--card);box-shadow:0 24px 70px rgba(0,0,0,.24);opacity:0;visibility:hidden;pointer-events:none;transform:translate(-50%,-46%);transition:opacity .18s ease,transform .18s ease}#turnstile-container.turnstile-visible{opacity:1;visibility:visible;pointer-events:auto;transform:translate(-50%,-50%)}#turnstile-container:empty{padding:0;border:0;box-shadow:none}</style>

<body>
<header class="top">
  <h1><svg class="logo" viewBox="0 0 512 512" aria-hidden="true"><rect width="512" height="512" rx="112" fill="#C8432B"/><line x1="304" y1="72" x2="216" y2="250" stroke="#FFF4E4" stroke-width="24" stroke-linecap="round"/><line x1="372" y1="88" x2="266" y2="250" stroke="#FFF4E4" stroke-width="24" stroke-linecap="round"/><rect x="78" y="234" width="356" height="36" rx="18" fill="#FFF4E4"/><path d="M100 262 H412 C406 354 340 404 256 404 C172 404 106 354 100 262 Z" fill="#FFF4E4"/><rect x="194" y="396" width="124" height="32" rx="12" fill="#FFF4E4"/></svg>點餐小幫手</h1>
  <div class="top-actions">
    <button type="button" id="btn-new-store" class="link-danger">新的一家店</button>
    <button type="button" id="btn-settings" class="icon-btn" aria-label="設定"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M10.325 4.317c.426 -1.756 2.924 -1.756 3.35 0a1.724 1.724 0 0 0 2.573 1.066c1.543 -.94 3.31 .826 2.37 2.37a1.724 1.724 0 0 0 1.065 2.572c1.756 .426 1.756 2.924 0 3.35a1.724 1.724 0 0 0 -1.066 2.573c.94 1.543 -.826 3.31 -2.37 2.37a1.724 1.724 0 0 0 -2.572 1.065c-.426 1.756 -2.924 1.756 -3.35 0a1.724 1.724 0 0 0 -2.573 -1.066c-1.543 .94 -3.31 -.826 -2.37 -2.37a1.724 1.724 0 0 0 -1.065 -2.572c-1.756 -.426 -1.756 -2.924 0 -3.35a1.724 1.724 0 0 0 1.066 -2.573c-.94 -1.543 .826 -3.31 2.37 -2.37c1 .608 2.296 .07 2.572 -1.065z"/><circle cx="12" cy="12" r="3"/></svg></button>
  </div>
</header>

<main id="view-home" class="view">
  <section class="scan-actions">
    <label class="big-btn" for="input-camera"><svg class="btn-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h2l2-3h6l2 3h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2z"/><circle cx="12" cy="13" r="3.5"/></svg>拍照</label>
    <input id="input-camera" type="file" accept="image/*" capture="environment" hidden>
    <label class="big-btn alt" for="input-album"><svg class="btn-ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9.5" r="1.5"/><path d="M21 15l-5-5-11 10"/></svg>從相簿選（可多張）</label>
    <input id="input-album" type="file" accept="image/*" multiple hidden>
    <input id="input-reselect" type="file" accept="image/*" hidden>
    <p class="hint">品項很多的頁面請分兩張拍。</p>
  </section>
  <h2>這家店的菜單</h2>
  <ul id="photo-list" class="photo-list"></ul>
  <div id="photo-empty" class="empty">
    <p class="empty-title">還沒有菜單照片</p>
    <ol class="steps">
      <li><b>1</b>拍菜單，每頁一張</li>
      <li><b>2</b>按「點餐」，在中文清單按＋</li>
      <li><b>3</b>按「給店員看」，出示日文點單</li>
    </ol>
  </div>
</main>

<main id="view-order" class="view" hidden>
  <div class="order-head">
    <button type="button" id="btn-order-back" class="row-btn">← 菜單照片</button>
    <span id="order-title" class="muted"></span>
  </div>
  <div id="cat-tabs" class="tabs" role="tablist"></div>
  <ul id="item-list" class="item-list"></ul>
  <button type="button" id="btn-add-manual" class="add-manual">＋ 清單裡沒有？手動加入品項</button>
  <p class="muted price-note">價格照菜單標示（含稅與否以店家為準）</p>
</main>
<footer id="order-bar" class="bottom-bar" hidden>
  <div class="sum">已點 <b id="order-count">0</b> 份 · <b id="order-total">¥0</b><div id="order-unpriced" class="muted"></div></div>
  <button type="button" id="btn-go-staff" class="primary">給店員看 →</button>
</footer>
<main id="view-staff" class="view staff" hidden>
  <div id="staff-sheet" class="staff-sheet" lang="ja"></div>
</main>
<footer id="staff-bar" class="bottom-bar" hidden>
  <button type="button" id="btn-staff-back" class="row-btn">← 返回修改</button>
  <label class="zh-toggle"><input type="checkbox" id="toggle-zh"> 中文對照</label>
</footer>

<footer id="home-bar" class="bottom-bar" hidden>
  <div class="sum">共 <b id="home-item-count">0</b> 個品項</div>
  <button type="button" id="btn-go-order" class="primary">點餐 →</button>
</footer>

<div id="dlg-settings" class="dialog" hidden>
  <div class="dialog-card" role="dialog" aria-labelledby="dlg-settings-title">
    <h3 id="dlg-settings-title">設定</h3>
    <label class="field">自己的 Gemini 金鑰（選填：共用額度用完時可用）
      <input id="input-api-key" type="password" autocomplete="off" placeholder="貼上你的 Gemini API 金鑰">
    </label>
    <p id="key-status" class="muted"></p>
    <button type="button" id="btn-reuse-key" class="row-btn" hidden>沿用辨譯 APP 已存的金鑰</button>
    <p id="usage-summary" class="muted"></p>
    <div class="dialog-actions">
      <button type="button" id="btn-settings-close" class="row-btn">關閉</button>
      <button type="button" id="btn-save-key" class="primary">儲存</button>
    </div>
  </div>
</div>

<div id="dlg-item" class="dialog" hidden>
  <div class="dialog-card" role="dialog" aria-labelledby="dlg-item-title">
    <h3 id="dlg-item-title">修改品項</h3>
    <label class="field">中文名（必填）<input id="item-zh" maxlength="40"></label>
    <label class="field">日文名（給店員看；不知道可空白）<input id="item-jp" maxlength="60"></label>
    <label class="field">價格（日圓，可空白）<input id="item-price" inputmode="numeric" maxlength="8"></label>
    <div class="dialog-actions">
      <button type="button" id="btn-item-delete" class="row-btn danger">刪除品項</button>
      <button type="button" id="btn-item-cancel" class="row-btn">取消</button>
      <button type="button" id="btn-item-save" class="primary">儲存</button>
    </div>
  </div>
</div>
<div id="photo-viewer" class="viewer" hidden>
  <button type="button" id="viewer-close" class="icon-btn viewer-close" aria-label="關閉">✕</button>
  <img id="viewer-img" alt="菜單照片">
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>
