<body>
<header class="top">
  <h1>🍽 點餐小幫手</h1>
  <div class="top-actions">
    <button type="button" id="btn-new-store" class="link-danger">新的一家店</button>
    <button type="button" id="btn-settings" class="icon-btn" aria-label="設定">⚙</button>
  </div>
</header>

<main id="view-home" class="view">
  <section class="scan-actions">
    <label class="big-btn" for="input-camera">📷 拍照</label>
    <input id="input-camera" type="file" accept="image/*" capture="environment" hidden>
    <label class="big-btn alt" for="input-album">🖼 從相簿選（可多張）</label>
    <input id="input-album" type="file" accept="image/*" multiple hidden>
    <input id="input-reselect" type="file" accept="image/*" hidden>
    <p class="hint">品項很多的頁面請分兩張拍。</p>
  </section>
  <h2>這家店的菜單</h2>
  <ul id="photo-list" class="photo-list"></ul>
  <p id="photo-empty" class="muted">還沒有菜單照片。</p>
</main>

<main id="view-order" class="view" hidden>
  <div class="order-head">
    <button type="button" id="btn-order-back" class="row-btn">← 菜單照片</button>
    <span id="order-title" class="muted"></span>
  </div>
  <div id="cat-tabs" class="tabs" role="tablist"></div>
  <ul id="item-list" class="item-list"></ul>
  <button type="button" id="btn-add-manual" class="add-manual">＋ 清單裡沒有？手動加入品項</button>
  <p class="muted price-note">價格照菜單標示（含稅與否以店家為準）</p>
</main>
<footer id="order-bar" class="bottom-bar" hidden>
  <div class="sum">已點 <b id="order-count">0</b> 份 · <b id="order-total">¥0</b><div id="order-unpriced" class="muted"></div></div>
  <button type="button" id="btn-go-staff" class="primary">給店員看 →</button>
</footer>
<main id="view-staff" class="view staff" hidden>
  <div id="staff-sheet" class="staff-sheet" lang="ja"></div>
</main>
<footer id="staff-bar" class="bottom-bar" hidden>
  <button type="button" id="btn-staff-back" class="row-btn">← 返回修改</button>
  <label class="zh-toggle"><input type="checkbox" id="toggle-zh"> 中文對照</label>
</footer>

<footer id="home-bar" class="bottom-bar" hidden>
  <div class="sum">共 <b id="home-item-count">0</b> 個品項</div>
  <button type="button" id="btn-go-order" class="primary">🍽 點餐</button>
</footer>

<div id="dlg-settings" class="dialog" hidden>
  <div class="dialog-card" role="dialog" aria-labelledby="dlg-settings-title">
    <h3 id="dlg-settings-title">設定 Gemini API 金鑰</h3>
    <label class="field">金鑰（只存在這支手機的瀏覽器）
      <input id="input-api-key" type="password" autocomplete="off" placeholder="貼上你的 Gemini API 金鑰">
    </label>
    <p id="key-status" class="muted"></p>
    <button type="button" id="btn-reuse-key" class="row-btn" hidden>沿用辨譯 APP 已存的金鑰</button>
    <p id="usage-summary" class="muted"></p>
    <div class="dialog-actions">
      <button type="button" id="btn-settings-close" class="row-btn">關閉</button>
      <button type="button" id="btn-save-key" class="primary">儲存</button>
    </div>
  </div>
</div>

<div id="dlg-item" class="dialog" hidden>
  <div class="dialog-card" role="dialog" aria-labelledby="dlg-item-title">
    <h3 id="dlg-item-title">修改品項</h3>
    <label class="field">中文名（必填）<input id="item-zh" maxlength="40"></label>
    <label class="field">日文名（給店員看；不知道可空白）<input id="item-jp" maxlength="60"></label>
    <label class="field">價格（日圓，可空白）<input id="item-price" inputmode="numeric" maxlength="8"></label>
    <div class="dialog-actions">
      <button type="button" id="btn-item-delete" class="row-btn danger">刪除品項</button>
      <button type="button" id="btn-item-cancel" class="row-btn">取消</button>
      <button type="button" id="btn-item-save" class="primary">儲存</button>
    </div>
  </div>
</div>
<div id="photo-viewer" class="viewer" hidden>
  <button type="button" id="viewer-close" class="icon-btn viewer-close" aria-label="關閉">✕</button>
  <img id="viewer-img" alt="菜單照片">
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>
